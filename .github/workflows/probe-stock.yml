name: Probe Stock Catalog
on:
  push:
    branches: [ probe-stock-catalog ]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect TGJU stock catalog
        shell: bash
        run: |
          set -e
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/126 Mobile Safari/537.36'
          for path in stock warrant fund; do
            echo "=== $path ==="
            curl -L --compressed -A "$UA" --max-time 30 -sS "https://www.tgju.org/markets/$path" -o "$path.html"
            echo -n "bytes="; wc -c < "$path.html"
            echo -n "rows="; grep -o 'data-symbol=' "$path.html" | wc -l
            echo -n "unique symbols="; grep -oP 'data-symbol=["'"']\K[^"'"']+' "$path.html" | sort -u | wc -l || true
            echo "page hints:"
            grep -oE 'href="[^"]*(page|offset|limit)[^"]*"' "$path.html" | head -20 || true
          done
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          ua={'User-Agent':'Mozilla/5.0'}
          for q in ['', 'فولاد', 'بانک', 'خودرو']:
              print('QUERY',repr(q))
              for page in range(1,6):
                  url='https://api.tgju.org/v1/newsearch?module=markets.internal&page='+str(page)
                  if q: url+='&q='+urllib.parse.quote(q)
                  req=urllib.request.Request(url,headers=ua)
                  try:
                      data=json.load(urllib.request.urlopen(req,timeout=20))
                  except Exception as e:
                      print('ERR',page,e); break
                  items=data.get('list') or []
                  stocks=[x for x in items if 'internal.stocks' in str(x.get('type','')).lower()]
                  print('page',page,'items',len(items),'stocks',len(stocks),'last',data.get('last'),
                        'sample',[x.get('grade') or x.get('s1') for x in stocks[:6]])
                  if data.get('last'): break
          PY
