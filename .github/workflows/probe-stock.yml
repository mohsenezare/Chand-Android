name: Probe Stock Module
on:
  push:
    branches: [ probe-stock-catalog ]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect TGJU stock module
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request
          ua={'User-Agent':'Mozilla/5.0'}
          for mod in ['markets.internal.stocks','markets.internal.stock','internal.stocks']:
              print('MODULE',mod)
              for page in range(1,8):
                  url=f'https://api.tgju.org/v1/newsearch?module={mod}&page={page}'
                  try:
                      req=urllib.request.Request(url,headers=ua)
                      raw=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','ignore')
                      print('page',page,'head',raw[:120].replace('\n',' '))
                      data=json.loads(raw)
                  except Exception as e:
                      print('ERR',page,e); break
                  items=data.get('list') or []
                  print(' items',len(items),'last',data.get('last'),'sample',[ (x.get('grade') if isinstance(x,dict) else str(x)[:20]) for x in items[:5] ])
                  if data.get('last'): break
          PY
