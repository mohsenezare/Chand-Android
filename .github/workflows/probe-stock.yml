name: Probe TGJU Swagger
on:
  push:
    branches: [ probe-stock-catalog ]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect TGJU API docs
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request
          for url in ['https://www.tgju.org/gem/api/v2.0/swagger.json','https://www.tgju.org/gem/api/apidocs/swagger.yaml']:
              print('URL',url)
              try:
                  raw=urllib.request.urlopen(url,timeout=30).read().decode('utf-8','ignore')
                  print('bytes',len(raw))
                  if url.endswith('.json'):
                      d=json.loads(raw)
                      for p,v in d.get('paths',{}).items():
                          text=(p+' '+json.dumps(v,ensure_ascii=False)).lower()
                          if any(k in text for k in ['stock','symbol','بورس','نماد']):
                              print('PATH',p, json.dumps(v,ensure_ascii=False)[:1500])
                  else:
                      for line in raw.splitlines():
                          if any(k in line.lower() for k in ['stock','symbol','بورس','نماد']):
                              print(line[:1000])
              except Exception as e:
                  print('ERR',e)
          PY
