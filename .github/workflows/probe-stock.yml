name: Probe Stock Pagination
on:
  push:
    branches: [ probe-stock-catalog ]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect TGJU stock pagination
        shell: bash
        run: |
          python3 - <<'PY'
          import re, urllib.request, hashlib
          ua={'User-Agent':'Mozilla/5.0 (Linux; Android 14)'}
          for suffix in ['', '?page=2','?page=3','?p=2','?offset=100','?start=100','?limit=500','?page=2&limit=100']:
              url='https://www.tgju.org/markets/stock'+suffix
              try:
                  req=urllib.request.Request(url,headers=ua)
                  s=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','ignore')
                  syms=re.findall(r'data-symbol=["\']([^"\']+)["\']',s)
                  print('URL',suffix or 'base','count',len(set(syms)),'first',syms[:6],'last',syms[-6:],'md5',hashlib.md5('|'.join(syms).encode()).hexdigest())
                  if suffix=='':
                      hints=re.findall(r'href="([^"]+)"',s)
                      print('HINTS',[h for h in hints if 'page' in h.lower() or 'offset' in h.lower() or 'limit' in h.lower()][:50])
              except Exception as e:
                  print('ERR',suffix,e)
          PY
