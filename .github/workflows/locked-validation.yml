name: Locked LIVE and system theme validation
on:
  push:
    branches: [codex/live-system-theme-20261025]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - run: unzip -q source.zip -d source
      - name: Test, lint and build exact supplied source
        working-directory: source
        run: bash gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Chand-Live-SystemTheme
          path: |
            source/app/build/outputs/apk/debug/app-debug.apk
            source/app/build/reports/tests/testDebugUnitTest/
            source/app/build/reports/lint-results-debug.*
          if-no-files-found: error
