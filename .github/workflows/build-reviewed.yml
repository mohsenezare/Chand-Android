name: Build reviewed Chand 3.3
on:
  push:
    branches: [ build/reviewed-v33-d8910 ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: chand-reviewed-debug-keystore-v1
      - name: Reconstruct reviewed source
        run: |
          cat payload/source.part.* | base64 --decode > source.zip
          unzip -t source.zip
          mkdir source
          unzip -q source.zip -d source
          chmod +x source/gradlew
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Test, build and lint
        working-directory: source
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - name: Verify and collect APK
        run: |
          mkdir out
          cp source/app/build/outputs/apk/debug/app-debug.apk out/Chand-v3.3-Reviewed.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs out/Chand-v3.3-Reviewed.apk > out/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 out/Chand-v3.3-Reviewed.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging out/Chand-v3.3-Reviewed.apk > out/package.txt
          sha256sum out/Chand-v3.3-Reviewed.apk > out/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Chand-v3.3-Reviewed-APK
          path: out/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Chand-v3.3-Reports
          path: |
            source/app/build/reports/
            source/app/build/test-results/
