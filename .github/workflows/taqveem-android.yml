name: Build TAQVEEM APK
on:
  workflow_dispatch:
  push:
    paths:
      - "TAQVEEM/**"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: TAQVEEM
        run: gradle :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: taqveem-debug-apk
          path: TAQVEEM/app/build/outputs/apk/debug/app-debug.apk
