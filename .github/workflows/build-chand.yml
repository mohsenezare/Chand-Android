name: Build Chand APK

on:
  push:
    branches: [ main ]
    paths:
      - 'payload/**'
      - '.github/workflows/build-chand.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p reconstructed
          cat payload/v33.part.0 payload/v33.part.1 payload/v33.part.2 payload/v33.part.3 > reconstructed/source.b64
          base64 --decode reconstructed/source.b64 > reconstructed/Chand-v4.0-Live-Architecture-Source.zip
          unzip -t reconstructed/Chand-v4.0-Live-Architecture-Source.zip
          mkdir -p source
          unzip -q reconstructed/Chand-v4.0-Live-Architecture-Source.zip -d source
          chmod +x source/gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
        with:
          min-wrapper-count: 1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Inspect reconstructed source
        shell: bash
        run: |
          set -euxo pipefail
          echo "=== SOURCE FILES ==="
          find source -type f | sort | head -200
          echo "=== UI TERMS ==="
          grep -RniE 'بازار جهانی|بازار|LIVE|MarketGrid|MarketBadge|TradingView|startTradingViewLiveStream|MarketStreamClient' source --include='*.kt' --include='*.xml' | head -300 || true

      - name: Inspect UI source ranges
        shell: bash
        run: |
          set -euxo pipefail
          echo "=== MAIN 145-185 ==="; sed -n '145,185p' source/app/src/main/java/ir/personal/chand/MainActivity.kt
          echo "=== GRID 280-390 ==="; sed -n '280,390p' source/app/src/main/java/ir/personal/chand/MainActivity.kt
          echo "=== BADGE 390-460 ==="; sed -n '390,460p' source/app/src/main/java/ir/personal/chand/MainActivity.kt
          echo "=== VM 210-285 ==="; sed -n '210,285p' source/app/src/main/java/ir/personal/chand/MainViewModel.kt
          echo "=== TV 50-190 ==="; sed -n '50,190p' source/app/src/main/java/ir/personal/chand/data/TradingViewStreamClient.kt
      - name: Inspect card tail
        shell: bash
        run: |
          set -euxo pipefail
          sed -n '420,560p' source/app/src/main/java/ir/personal/chand/MainActivity.kt
          echo "=== imports ==="; sed -n '1,120p' source/app/src/main/java/ir/personal/chand/MainActivity.kt
          echo "=== vm tail ==="; sed -n '285,380p' source/app/src/main/java/ir/personal/chand/MainViewModel.kt
      - name: Inspect status UI
        shell: bash
        run: |
          set -euxo pipefail
          grep -nE 'originLabel|DataOrigin\.LIVE|item\.origin|item\.source|MarketFormatting|Text\(' source/app/src/main/java/ir/personal/chand/MainActivity.kt | sed -n '1,220p'
      - name: Apply final v4.0 UI/live fixes
        shell: bash
        run: |
          set -euxo pipefail
          echo '' | base64 -d > /tmp/fix.py
          python3 /tmp/fix.py
      - name: Apply clean live + complete TSETMC catalog fixes
        shell: bash
        run: |
          set -euxo pipefail
          python3 build_support/chand_patch.py

      - name: Build debug APK
        working-directory: source
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Provider probe (non-blocking)
        shell: bash
        run: echo "Live provider probes are optional; APK build is authoritative."

      - name: Collect APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          APK=$(find source/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          cp "$APK" out/Chand-v4.0-live-architecture-debug.apk
          sha256sum out/Chand-v4.0-live-architecture-debug.apk | tee out/SHA256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chand-v4.0-Live-Architecture-APK
          path: |
            out/Chand-v4.0-live-architecture-debug.apk
            out/SHA256.txt
          if-no-files-found: error

# Rebuild verified v4.0 APK
