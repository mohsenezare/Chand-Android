name: Build Chand APK

on:
  push:
    branches: [ main ]
    paths:
      - 'payload/**'
      - '.github/workflows/build-chand.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p reconstructed
          cat payload/v33.part.0 payload/v33.part.1 payload/v33.part.2 payload/v33.part.3 > reconstructed/source.b64
          base64 --decode reconstructed/source.b64 > reconstructed/Chand-v4.0-Live-Architecture-Source.zip
          unzip -t reconstructed/Chand-v4.0-Live-Architecture-Source.zip
          mkdir -p source
          unzip -q reconstructed/Chand-v4.0-Live-Architecture-Source.zip -d source
          chmod +x source/gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
        with:
          min-wrapper-count: 1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Inspect reconstructed source
        shell: bash
        run: |
          set -euxo pipefail
          echo "=== SOURCE FILES ==="
          find source -type f | sort | head -200
          echo "=== UI TERMS ==="
          grep -RniE 'بازار جهانی|بازار|LIVE|MarketGrid|MarketBadge|TradingView|startTradingViewLiveStream|MarketStreamClient' source --include='*.kt' --include='*.xml' | head -300 || true

      - name: Inspect UI source ranges
        shell: bash
        run: |
          set -euxo pipefail
          echo "=== MAIN 145-185 ==="; sed -n '145,185p' source/app/src/main/java/ir/personal/chand/MainActivity.kt
          echo "=== GRID 280-390 ==="; sed -n '280,390p' source/app/src/main/java/ir/personal/chand/MainActivity.kt
          echo "=== BADGE 390-460 ==="; sed -n '390,460p' source/app/src/main/java/ir/personal/chand/MainActivity.kt
          echo "=== VM 210-285 ==="; sed -n '210,285p' source/app/src/main/java/ir/personal/chand/MainViewModel.kt
          echo "=== TV 50-190 ==="; sed -n '50,190p' source/app/src/main/java/ir/personal/chand/data/TradingViewStreamClient.kt
      - name: Inspect card tail
        shell: bash
        run: |
          set -euxo pipefail
          sed -n '420,560p' source/app/src/main/java/ir/personal/chand/MainActivity.kt
          echo "=== imports ==="; sed -n '1,120p' source/app/src/main/java/ir/personal/chand/MainActivity.kt
          echo "=== vm tail ==="; sed -n '285,380p' source/app/src/main/java/ir/personal/chand/MainViewModel.kt
      - name: Inspect status UI
        shell: bash
        run: |
          set -euxo pipefail
          grep -nE 'originLabel|DataOrigin\.LIVE|item\.origin|item\.source|MarketFormatting|Text\(' source/app/src/main/java/ir/personal/chand/MainActivity.kt | sed -n '1,220p'
      - name: Apply final v4.0 UI/live fixes
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("source/app/src/main/java/ir/personal/chand/MainActivity.kt")
          s=p.read_text()
          if 'import androidx.compose.foundation.lazy.grid.GridItemSpan' not in s:
              s=s.replace('import androidx.compose.foundation.lazy.grid.GridCells\\n','import androidx.compose.foundation.lazy.grid.GridCells\\nimport androidx.compose.foundation.lazy.grid.GridItemSpan\\n')
          start=s.index('@Composable\\nprivate fun MarketGrid(')
          end=s.index('@Composable\\nprivate fun MarketCard(', start)
          new='''@Composable
private fun MarketGrid(
    items: List<MarketItem>,
    gridMode: Boolean,
    onItemClick: (MarketItem) -> Unit
) {
    val gridState = rememberLazyGridState()
    val columns = if (gridMode) 2 else 1
    val sections = listOf(
        "بازار" to items.filter { it.source == ir.personal.chand.data.MarketSource.TGJU },
        "بورس" to items.filter { it.source == ir.personal.chand.data.MarketSource.TSETMC },
        "بازار جهانی" to items.filter { it.source == ir.personal.chand.data.MarketSource.TRADINGVIEW }
    )
    LazyVerticalGrid(
        columns = GridCells.Fixed(columns),
        state = gridState,
        contentPadding = PaddingValues(start = 14.dp, end = 14.dp, top = 4.dp, bottom = 10.dp),
        horizontalArrangement = Arrangement.spacedBy(10.dp),
        verticalArrangement = Arrangement.spacedBy(8.dp),
        modifier = Modifier.fillMaxSize()
    ) {
        sections.forEach { (title, sectionItems) ->
            item(span = { GridItemSpan(columns) }) {
                Text(
                    text = title,
                    color = MaterialTheme.colorScheme.onBackground,
                    fontSize = 17.sp,
                    fontWeight = FontWeight.Bold,
                    modifier = Modifier.padding(top = 10.dp, bottom = 2.dp)
                )
            }
            if (sectionItems.isEmpty()) {
                item(span = { GridItemSpan(columns) }) {
                    Text(
                        text = "موردی برای نمایش نیست",
                        color = ChandMuted,
                        fontSize = 12.sp,
                        modifier = Modifier.padding(bottom = 4.dp)
                    )
                }
            } else {
                items(sectionItems, key = MarketItem::id) { item ->
                    MarketCard(
                        item = item,
                        gridMode = gridMode,
                        modifier = Modifier
                            .fillMaxWidth()
                            .aspectRatio(if (gridMode) 1.12f else 2.25f),
                        onClick = { onItemClick(item) }
                    )
                }
            }
        }
    }
}

'''
          s=s[:start]+new+s[end:]
          old='MarketBadge(item, Modifier.size(if (compact) 45.dp else 54.dp))'
          repl='''Box(modifier = Modifier.size(if (compact) 45.dp else 54.dp)) {
                            MarketBadge(item, Modifier.fillMaxSize())
                            if (item.origin == DataOrigin.LIVE) {
                                Surface(
                                    color = Color(0xFF245B43),
                                    shape = RoundedCornerShape(6.dp),
                                    modifier = Modifier.align(Alignment.TopEnd)
                                ) { Text("LIVE", color = Color.White, fontSize = 7.sp, fontWeight = FontWeight.Bold, modifier = Modifier.padding(horizontal = 4.dp, vertical = 2.dp)) }
                            }
                        }'''
          if old in s:
              s=s.replace(old,repl,1)
          p.write_text(s)

          vm=Path("source/app/src/main/java/ir/personal/chand/MainViewModel.kt")
          v=vm.read_text()
          v=v.replace('const val LIVE_RECONCILE_INTERVAL_MS = 30_000L','const val LIVE_RECONCILE_INTERVAL_MS = 5_000L')
          vm.write_text(v)
          PY
      - name: Build debug APK
        working-directory: source
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Provider probe (non-blocking)
        shell: bash
        run: echo "Live provider probes are optional; APK build is authoritative."

      - name: Collect APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          APK=$(find source/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          cp "$APK" out/Chand-v4.0-live-architecture-debug.apk
          sha256sum out/Chand-v4.0-live-architecture-debug.apk | tee out/SHA256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chand-v4.0-Live-Architecture-APK
          path: |
            out/Chand-v4.0-live-architecture-debug.apk
            out/SHA256.txt
          if-no-files-found: error

# Rebuild verified v4.0 APK
