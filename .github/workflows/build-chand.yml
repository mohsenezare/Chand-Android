name: Build Chand APK

on:
  push:
    branches: [ main ]
    paths:
      - 'payload/**'
      - '.github/workflows/build-chand.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p reconstructed
          cat payload/v33.part.0 payload/v33.part.1 payload/v33.part.2 payload/v33.part.3 payload/v33.part.4 > reconstructed/source.b64
          base64 --decode reconstructed/source.b64 > reconstructed/Chand-v4.0-Live-Architecture-Source.zip
          unzip -t reconstructed/Chand-v4.0-Live-Architecture-Source.zip
          mkdir -p source
          unzip -q reconstructed/Chand-v4.0-Live-Architecture-Source.zip -d source
          chmod +x source/gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
        with:
          min-wrapper-count: 1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: source
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Probe live providers
        continue-on-error: true
        shell: bash
        run: |
          set -u
          cd source
          python3 - <<'PY' | tee ../provider-probe.txt
          import json, urllib.request, urllib.parse
          ua={"User-Agent":"Mozilla/5.0 Chrome/126 Chand/4.0","Accept":"application/json,text/plain,*/*"}
          def get(url, timeout=15):
              req=urllib.request.Request(url,headers=ua)
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  body=r.read().decode("utf-8","replace")
                  print("HTTP",r.status,url,"bytes",len(body))
                  return body
          try:
              mw=get("https://cdn.tsetmc.com/api/ClosingPrice/GetMarketWatch?market=0&industrialGroup=&paperTypes%5B0%5D=1&paperTypes%5B1%5D=2&paperTypes%5B2%5D=3&paperTypes%5B3%5D=4&paperTypes%5B4%5D=5&paperTypes%5B5%5D=6&paperTypes%5B6%5D=7&paperTypes%5B7%5D=8&paperTypes%5B8%5D=9&showTraded=false&withBestLimits=true&hEven=0&RefID=0")
              data=json.loads(mw)
              assert len(mw)>1000
              print("TSETMC_MARKETWATCH=PASS")
          except Exception as e:
              print("TSETMC_MARKETWATCH=FAIL",repr(e))
          try:
              q=urllib.parse.quote("فولاد")
              sr=get("https://cdn.tsetmc.com/api/Instrument/GetInstrumentSearch/"+q)
              assert "insCode" in sr
              print("TSETMC_SEARCH=PASS")
          except Exception as e:
              print("TSETMC_SEARCH=FAIL",repr(e))
          PY
          python3 -m pip install -q websocket-client
          python3 - <<'PY' | tee -a ../provider-probe.txt
          import json,time,websocket
          def frame(obj):
              p=json.dumps(obj,separators=(",",":"))
              return f"~m~{len(p.encode())}~m~{p}"
          try:
              ws=websocket.create_connection("wss://data.tradingview.com/socket.io/websocket?from=chand",origin="https://www.tradingview.com",timeout=10)
              session="qs_chand_probe"
              ws.send(frame({"m":"set_auth_token","p":["unauthorized_user_token"]}))
              ws.send(frame({"m":"quote_create_session","p":[session]}))
              ws.send(frame({"m":"quote_set_fields","p":[session,"lp","lp_time","ch","chp","trade_time","rtc"]}))
              ws.send(frame({"m":"quote_add_symbols","p":[session,"BITSTAMP:BTCUSD",{"flags":["force_permission"]}]}))
              ws.send(frame({"m":"quote_fast_symbols","p":[session,"BITSTAMP:BTCUSD"]}))
              deadline=time.time()+20
              ok=False
              while time.time()<deadline:
                  msg=ws.recv()
                  if isinstance(msg,bytes): msg=msg.decode("utf-8","replace")
                  if "~h~" in msg:
                      for seg in msg.split("~m~"):
                          if seg.startswith("~h~"): ws.send(f"~m~{len(seg)}~m~{seg}")
                  if '"m":"qsd"' in msg and '"lp"' in msg and "BITSTAMP:BTCUSD" in msg:
                      ok=True; print("TRADINGVIEW_QSD=PASS",msg[:500]); break
              ws.close()
              if not ok: raise RuntimeError("no qsd lp packet in 20s")
          except Exception as e:
              print("TRADINGVIEW_QSD=FAIL",repr(e))
          PY

      - name: Collect APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          APK=$(find source/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          cp "$APK" out/Chand-v4.0-live-architecture-debug.apk
          sha256sum out/Chand-v4.0-live-architecture-debug.apk | tee out/SHA256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chand-v4.0-Live-Architecture-APK
          path: |
            out/Chand-v4.0-live-architecture-debug.apk
            out/SHA256.txt
          if-no-files-found: error
