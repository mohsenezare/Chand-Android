name: Build Chand v4.8.4 Requested Fixes APK
on:
  push:
    branches:
      - build/requested-fixes-v4-8-4-20261024
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Extract exact uploaded source
        run: |
          mkdir -p uploaded-source
          unzip -q build-input/Chand-v4.8.4-Requested-Fixes-Source.zip -d uploaded-source
      - name: Build debug APK
        working-directory: uploaded-source
        run: |
          gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Archive APK
        uses: actions/upload-artifact@v4
        with:
          name: Chand-v4.8.4-Requested-Fixes-APK
          path: uploaded-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
