name: Build Chand v4.8.4 Requested Fixes APK
on:
  push:
    branches:
      - build/requested-fixes-v4-8-4-20261024
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Prepare Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Extract exact uploaded source
        run: |
          mkdir -p uploaded-source
          unzip -q build-input/Chand-v4.8.4-Requested-Fixes-Source.zip -d uploaded-source
      - name: Build debug APK
        working-directory: uploaded-source
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug --stacktrace
      - name: Archive APK
        uses: actions/upload-artifact@v4
        with:
          name: Chand-v4.8.4-Requested-Fixes-APK
          path: uploaded-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
